name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Validate Learn content
        # Cross-references, uniqueness and advice-shaped language. Called out as its own step
        # so a content mistake reads as a content failure rather than a generic test failure.
        run: npm run validate:content
      - name: Test
        run: npm test
      - name: Build
        run: npx vite build
      - name: Enforce the bundle budget
        # ARCHITECTURE.md §5: 200 KB gzipped for the initial chunk. A regression here is a
        # startup regression on the reference 2016 Intel MacBook.
        run: |
          set -euo pipefail
          largest=0
          for file in dist/assets/index-*.js; do
            size=$(gzip -c "$file" | wc -c)
            echo "$file: $size bytes gzipped"
            if [ "$size" -gt "$largest" ]; then largest=$size; fi
          done
          echo "Largest entry chunk: $largest bytes gzipped (budget: 204800)"
          if [ "$largest" -gt 204800 ]; then
            echo "::error::Initial bundle exceeds the 200 KB gzipped budget."
            exit 1
          fi

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            build-essential curl wget file libxdo-dev libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      # Failures are echoed back as workflow annotations, not just left in the log.
      # Job logs need repo-admin rights to download; annotations are readable by anyone. On a
      # matrix where one platform fails and the others pass, that difference is what decides
      # whether the failure can be diagnosed without pushing another commit to find out.
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          cargo test --manifest-path src-tauri/Cargo.toml --no-fail-fast \
            2>&1 | tee test-output.txt && status=0 || status=$?

          if [ "$status" -ne 0 ]; then
            echo "::error::Rust tests failed on ${{ matrix.os }}"

            # The names, from the `failures:` summary cargo prints at the end.
            sed -n '/^failures:$/,/^test result:/p' test-output.txt \
              | grep -E '^    ' | sort -u | while IFS= read -r name; do
                echo "::error::failed:${name## }"
              done

            # The first assertion message, which is usually the whole story.
            grep -E "panicked at|assertion .*failed|left:|right:" test-output.txt \
              | head -12 | while IFS= read -r line; do
                echo "::error::${line}"
              done
          fi

          exit "$status"

      - name: Keep the test output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rust-test-output-${{ matrix.os }}
          path: test-output.txt

      # ADR-010, and the whole point of generating the types: `cargo test` re-exports
      # `src/types/generated/` from the Rust models, so if the committed output differs the
      # models changed without the TypeScript being regenerated. Running on one platform is
      # enough — the output is identical everywhere, and checking on all three would just
      # fail three times for one cause.
      - name: Check the generated TypeScript is in step with the Rust models
        if: matrix.os == 'ubuntu-latest'
        run: |
          if ! git diff --quiet -- src/types/generated; then
            echo "::error::src/types/generated is out of date. Run 'cargo test' in src-tauri and commit the result."
            git diff --stat -- src/types/generated
            git diff -- src/types/generated | head -100
            exit 1
          fi
          echo "Generated types match the Rust models."
          retention-days: 7

  build:
    name: App build (${{ matrix.os }})
    needs: [frontend, rust]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            build-essential curl wget file libxdo-dev libssl-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci
      # Verifies the app compiles and links on every platform. Installer artifacts come from
      # a separate release workflow once there is something to release.
      - run: npm run tauri:build -- --no-bundle

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: npm audit
        run: npm audit --audit-level=high
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo audit
        run: |
          cargo install cargo-audit --locked
          cargo audit --file src-tauri/Cargo.lock
