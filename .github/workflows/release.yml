name: Release

# Tag-driven. Pushing `v0.1.0` builds installers on all three platforms and attaches them to a
# GitHub Release. Nothing is published on an ordinary push — cutting a release is a deliberate
# act, not a side effect of merging.
on:
  push:
    tags:
      - 'v*'
  # Lets a release be re-run from the Actions tab without moving the tag.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  # The release is created once, before any build runs.
  #
  # v0.1.0 shipped with an empty body and no pre-release flag because all three matrix legs
  # raced to create the release and the one that won passed neither. `tauri-action` only applies
  # releaseBody and prerelease when it *creates* a release, so whichever job got there first
  # decided the metadata for everything. Creating it in a single job first removes the race:
  # the matrix then uploads to a release that already has its notes.
  create-release:
    name: Create the release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # Deliberately not `tauri-action` here. That action always runs `npm run tauri build`;
      # there is no create-only mode, so in a job with no Node or Rust toolchain it exits 127.
      # The REST API is what this step actually needs, and `github-script` is first-party.
      #
      # Notes live in `.github/release-notes.md` so they can be reviewed in a diff rather than
      # buried in YAML indentation.
      - uses: actions/github-script@v7
        id: create
        with:
          script: |
            const fs = require('fs');
            const tag = context.payload.inputs?.tag || context.ref.replace('refs/tags/', '');
            const body = fs.readFileSync('.github/release-notes.md', 'utf8');
            const version = tag.replace(/^v/, '');

            const options = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `Brew Terminal ${version}`,
              body,
              draft: false,
              // Pre-release until someone has actually run the build on Windows and Linux.
              prerelease: true,
            };

            let release;
            try {
              release = (await github.rest.repos.createRelease(options)).data;
              core.info(`created release ${release.id}`);
            } catch (error) {
              // A re-run finds the release already there. Update it rather than failing, so the
              // notes still land — that is the whole reason this job exists.
              if (error.status !== 422) throw error;
              const existing = await github.rest.repos.getReleaseByTag({
                owner: options.owner, repo: options.repo, tag,
              });
              release = (await github.rest.repos.updateRelease({
                ...options, release_id: existing.data.id,
              })).data;
              core.info(`updated existing release ${release.id}`);
            }

            core.setOutput('release_id', release.id);

  release:
    name: ${{ matrix.label }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS is built as a universal binary rather than per-architecture. The reference
          # machine for this project is a 2016 Intel MacBook, and GitHub's macos-latest runner
          # is Apple Silicon — building only there would produce something the project's own
          # target hardware cannot run.
          - os: macos-latest
            label: macOS (universal)
            args: '--target universal-apple-darwin'
            rust_targets: 'x86_64-apple-darwin,aarch64-apple-darwin'

          # 22.04 rather than latest: the AppImage links against the runner's glibc, so
          # building on a newer distro silently raises the minimum glibc for every user.
          - os: ubuntu-22.04
            label: Linux (AppImage + deb)
            args: ''
            rust_targets: ''

          - os: windows-latest
            label: Windows (MSI + NSIS)
            args: ''
            rust_targets: ''

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            build-essential curl wget file libxdo-dev libssl-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Uploading to the release created above, so this leg never touches its metadata.
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}
